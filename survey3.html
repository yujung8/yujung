<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>소프트웨어 기술 선호에 관한 설문</title>
    </head>
    <body>
        <h1>설문지</h1>
        소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
        <hr>
        <section>
            <form>
                학년 
                <input type="radio" name="grade" value="1"> 1학년
                <input type="radio" name="grade" value="2"> 2학년
                <input type="radio" name="grade" value="3"> 3학년
                <input type="radio" name="grade" value="4"> 4학년
                <br><br>

                성별
                <input type="radio" name="gender" value="1"> 남성
                <input type="radio" name="gender" value="2"> 여성
                <br><br>

                관심 분야
                <select name="interest">
                    <option value="1">모바일 소프트웨어</option>
                    <option value="2">데이터 분석</option>
                    <option value="3">정보 보안</option>
                </select>
                <br><br>

                진로
                <input type="checkbox" name="career" value="1"> 개발
                <input type="checkbox" name="career" value="2"> 기획
                <input type="checkbox" name="career" value="3"> 영업
                <input type="checkbox" name="career" value="4"> 창업
                <br><br>

                남기고 싶은 말<br>
                <textarea cols="50" rows="20">글을 남겨주세요~!</textarea>
                <br><br>
                </form>
        </section>
        <footer>Copyright 2022 by Kitae</footer>
    </body>
</html>
